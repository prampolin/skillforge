[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "skillforge-backend"
version = "0.1.0"
description = "Local-first orchestration backend for SkillForge."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.142.4",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
